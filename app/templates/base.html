<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}책의 한 장면{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
  {% block styles %}{% endblock %}
</head>
<body>
  <header class="site-header"><a class="brand" href="/">책의 한 장면<span>읽고, 생각을 남기는 시간</span></a></header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    {% if config.NOTICE_TEXT %}<p>{{ config.NOTICE_TEXT }}</p>{% elif config.LOCAL_DEVELOPMENT %}<p>로컬 테스트 화면입니다. 실제 실험의 수집 고지와 보관 정책은 운영 전에 확정합니다.</p>{% endif %}
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
